<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>N5帳 — Minna no Nihongo N5 Flashcards</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2216%22 fill=%22%23BE3A34%22/><text x=%2250%22 y=%2268%22 font-size=%2260%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22serif%22>語</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kurenaido&family=Noto+Serif+JP:wght@500;700;900&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <!-- Header -->
  <header class="header">
    <div class="brand">
      <span class="brand-mark">語</span>
      <div class="brand-text">
        <h1>N5帳<span class="brand-sub-inline">・N5-chō</span></h1>
        <p class="brand-sub">Minna no Nihongo — vocabulary drill</p>
      </div>
    </div>

    <div class="controls">
      <label class="field lesson-field">
        <span class="field-label">Lesson</span>
        <select id="lessonSelect" aria-label="Filter by lesson"></select>
      </label>

      <label class="field search-field">
        <span class="field-label">Search</span>
        <div class="search-box">
          <svg viewBox="0 0 24 24" width="16" height="16" class="search-icon" aria-hidden="true"><path fill="currentColor" d="M21 20.3 15.6 15a7.6 7.6 0 1 0-1.4 1.4l5.3 5.4Zm-9.5-4.3a5.6 5.6 0 1 1 0-11.2 5.6 5.6 0 0 1 0 11.2Z"/></svg>
          <input id="searchInput" type="text" placeholder="Kanji, hiragana, romaji, meaning…" autocomplete="off" spellcheck="false">
          <button id="clearSearch" class="clear-btn" aria-label="Clear search" hidden>&times;</button>
        </div>
      </label>

      <button id="favToggle" class="pill-btn" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path fill="currentColor" d="m12 17.3-6.2 3.7 1.6-7-5.4-4.7 7.1-.6L12 2l2.9 6.7 7.1.6-5.4 4.7 1.6 7Z"/></svg>
        <span>Favorites</span>
      </button>
    </div>
  </header>

  <!-- Status strip -->
  <div class="status-strip">
    <div class="status-left">
      <span id="deckCount">0 words</span>
      <span class="dot">·</span>
      <span id="lessonLabel">All lessons</span>
    </div>
    <div class="progress-track" aria-hidden="true">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="status-right" id="cardCounter">0 / 0</div>
  </div>

  <!-- Empty state -->
  <div class="empty-state" id="emptyState" hidden>
    <p class="empty-glyph">〜</p>
    <p class="empty-title">No words match</p>
    <p class="empty-sub">Try a different lesson, or clear your search / favorites filter.</p>
    <button id="emptyReset" class="text-btn">Reset filters</button>
  </div>

  <!-- Stage -->
  <main class="stage" id="stage">
    <button class="nav-btn nav-prev" id="prevBtn" aria-label="Previous card">
      <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M15 4 6 12l9 8 1.4-1.4L8.8 12l7.6-6.6Z"/></svg>
    </button>

    <div class="card-wrap">
      <div class="card" id="card" tabindex="0" role="button" aria-label="Flashcard, press space to flip">
        <div class="card-inner" id="cardInner">

          <!-- FRONT -->
          <section class="card-face card-front">
            <div class="lesson-tab" id="frontLesson">L.1</div>
            <button class="fav-star" id="favStar" aria-label="Toggle favorite" aria-pressed="false">
              <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="m12 17.3-6.2 3.7 1.6-7-5.4-4.7 7.1-.6L12 2l2.9 6.7 7.1.6-5.4 4.7 1.6 7Z"/></svg>
            </button>
            <div class="face-body">
              <p class="kanji-display" id="kanjiDisplay">私</p>
              <p class="hiragana-display" id="hiraganaDisplay">わたし</p>
            </div>
            <p class="flip-hint">tap to flip · space</p>
          </section>

          <!-- BACK -->
          <section class="card-face card-back">
            <div class="lesson-tab lesson-tab-back" id="backLesson">L.1</div>
            <div class="face-body">
              <p class="romaji-display" id="romajiDisplay">watashi</p>
              <div class="rule"></div>
              <p class="meaning-display" id="meaningDisplay">I</p>
            </div>
            <div class="hanko" id="hankoStamp">推</div>
            <p class="flip-hint">tap to flip · space</p>
          </section>

        </div>
      </div>
    </div>

    <button class="nav-btn nav-next" id="nextBtn" aria-label="Next card">
      <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M9 4 8 5.4l7.6 6.6L8 18.6 9 20l9-8Z"/></svg>
    </button>
  </main>

  <!-- Deck controls -->
  <div class="deck-controls">
    <button id="shuffleBtn" class="ghost-btn">
      <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M17 3h4v4h-2V6.4l-4.6 4.6-1.4-1.4L17.6 5H17V3ZM3 5h5.6l9 9H21v2h-4.1l-9-9H3V5Zm14 16v-2h.6l-2.1-2.1 1.4-1.4L19 17.6V17h2v4h-4ZM8.6 15l-4.2 4.2-1.4-1.4L7.2 13.6 8.6 15Z"/></svg>
      Shuffle
    </button>
    <button id="flipBtn" class="ghost-btn">
      <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M12 5V2L8 6l4 4V7c3.3 0 6 2.7 6 6 0 1-.3 2-.7 2.8l1.5 1.5A8 8 0 0 0 12 5ZM6 12c0-1 .3-2 .7-2.8L5.2 7.7A8 8 0 0 0 12 19v3l4-4-4-4v3c-3.3 0-6-2.7-6-6Z"/></svg>
      Flip
    </button>
    <button id="restartBtn" class="ghost-btn">
      <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M6 6v3l4-4-4-4v3a9 9 0 1 0 9 9h-2a7 7 0 1 1-7-7Z" transform="translate(0 2)"/></svg>
      Restart
    </button>
  </div>

  <footer class="footer">
    <span>← → navigate</span><span class="dot">·</span><span>space flip</span><span class="dot">·</span><span>f favorite</span><span class="dot">·</span><span id="favCount">0 favorited</span>
  </footer>

</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
